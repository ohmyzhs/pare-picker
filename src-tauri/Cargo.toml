[package]
name = "pair-picker"
version = "0.1.0"
description = "Choose one image from each pair"
authors = ["Gabriel"]
edition = "2021"

[lib]
name = "pair_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5"
